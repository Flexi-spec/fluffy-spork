<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P.OS | Cloud Command Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #020617;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --glass: rgba(15, 23, 42, 0.8);
            --border: rgba(255, 255, 255, 0.08);
        }

        * { -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-deep); 
            color: #f8fafc; 
            overflow: hidden; 
            height: 100vh;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* BOOT SEQUENCE */
        #boot-screen {
            position: fixed; inset: 0; background: black; z-index: 999;
            display: flex; flex-direction: column; justify-content: center; padding: 2rem;
        }

        /* UI COMPONENTS */
        .sidebar { 
            width: 340px; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 1px solid var(--border);
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
        }

        .chat-bubble {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 22px;
            font-size: 0.92rem;
            line-height: 1.5;
            position: relative;
            transition: transform 0.2s ease;
        }

        .mine { 
            background: linear-gradient(135deg, #2563eb, #1d4ed8); 
            align-self: flex-end; 
            border-bottom-right-radius: 4px;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
        }

        .theirs { 
            background: #1e293b; 
            align-self: flex-start; 
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        /* ANIMATIONS */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.2; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; position: relative; }
        .status-dot::after {
            content: ''; position: absolute; inset: -4px;
            border: 2px solid currentColor; border-radius: 50%;
            animation: pulse-ring 2s infinite;
        }

        .scroll-hide::-webkit-scrollbar { width: 0px; background: transparent; }

        /* GUEST MODE OVERRIDES */
        body.guest-mode .sidebar { width: 0; opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="flex">

    <div id="boot-screen">
        <div class="max-w-md mx-auto w-full">
            <div id="boot-logs" class="mono text-xs text-blue-500 space-y-1 mb-8"></div>
            <div class="h-1 w-full bg-slate-900 rounded-full overflow-hidden">
                <div id="boot-progress" class="h-full bg-blue-600 w-0 transition-all duration-300"></div>
            </div>
        </div>
    </div>

    <aside id="sidebar" class="sidebar bg-slate-950 flex flex-col z-50">
        <div class="p-8">
            <div class="flex items-center gap-3 mb-2">
                <div class="bg-blue-600 w-8 h-8 rounded-lg flex items-center justify-center font-black italic">P</div>
                <h2 class="text-xl font-extrabold tracking-tighter">OS COMMAND</h2>
            </div>
            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-[0.2em] mb-8">Mainframe Node 042</p>

            <div class="space-y-4">
                <div class="group">
                    <label class="text-[10px] font-bold text-slate-500 ml-2 mb-1 block">SECURE CHANNEL NAME</label>
                    <input type="text" id="target-name" placeholder="Agent Alias..." 
                        class="w-full bg-slate-900 border border-white/5 p-4 rounded-2xl outline-none text-sm focus:ring-1 ring-blue-500 transition-all">
                </div>
                <button onclick="addGlobalContact()" 
                    class="w-full bg-blue-600 hover:bg-blue-500 p-4 rounded-2xl font-bold text-xs flex items-center justify-center gap-2 transition-all active:scale-95 shadow-lg shadow-blue-900/20">
                    <i class="fas fa-plus-circle"></i> INITIALIZE LINK
                </button>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto px-6 pb-8 scroll-hide">
            <div class="flex items-center justify-between mb-4 px-2">
                <p class="text-[10px] text-slate-500 font-bold uppercase">Active Frequency</p>
                <span id="contact-count" class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-blue-400">0</span>
            </div>
            <div id="contact-list" class="space-y-3">
                </div>
        </div>
        
        <div class="p-6 border-t border-white/5 glass-panel">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center border border-white/10">
                    <i class="fas fa-user-shield text-blue-400"></i>
                </div>
                <div>
                    <p class="text-xs font-bold">Professor</p>
                    <p class="text-[9px] text-green-500 uppercase font-bold tracking-tighter">Root Privileges</p>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative">
        
        <header class="h-20 glass-panel flex items-center justify-between px-4 md:px-10 z-40">
            <div class="flex items-center gap-4">
                <button id="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" 
                    class="md:hidden w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center border border-white/10">
                    <i class="fas fa-bars text-blue-500"></i>
                </button>
                <div id="status-dot" class="status-dot text-slate-600"></div>
                <div>
                    <h1 id="header-name" class="font-extrabold text-sm md:text-lg tracking-tight">System Idle</h1>
                    <div class="flex items-center gap-2">
                        <p id="header-status" class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">Awaiting Command</p>
                        <span id="ping-timer" class="text-[8px] mono text-slate-600"></span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2 md:gap-5">
                <button onclick="triggerCall()" class="w-10 h-10 rounded-xl hover:bg-white/5 flex items-center justify-center text-green-500 transition-all">
                    <i class="fas fa-phone-alt"></i>
                </button>
                <button onclick="copyLink()" class="hidden md:flex text-[10px] font-black bg-blue-600 px-5 py-2.5 rounded-xl hover:bg-blue-500 transition-all active:scale-95">SHARE LINK</button>
                <button onclick="clearCurrentRoom()" class="text-slate-500 hover:text-red-500 transition-colors"><i class="fas fa-trash-alt text-sm"></i></button>
            </div>
        </header>

        <div id="chat-window" class="flex-1 overflow-y-auto p-4 md:p-10 flex flex-col space-y-6 scroll-hide">
            <div class="h-full flex flex-col items-center justify-center text-center opacity-20 select-none">
                <i class="fas fa-terminal text-7xl mb-6"></i>
                <p class="mono text-sm tracking-widest">P.OS v2.04 // CLOUD_COMMAND</p>
                <p class="text-[10px] mt-2">SECURE END-TO-END ENCRYPTED SOCKET</p>
            </div>
        </div>

        <div class="p-4 md:p-8 glass-panel border-t-0">
            <form id="send-form" class="max-w-4xl mx-auto relative flex gap-3">
                <div class="relative flex-1">
                    <input type="text" id="msg-input" autocomplete="off" 
                        placeholder="Enter command or message..." 
                        class="w-full bg-slate-900/80 border border-white/5 py-4 md:py-5 px-6 rounded-2xl outline-none focus:ring-1 ring-blue-500/50 text-sm transition-all pr-12">
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 flex gap-2 text-slate-600">
                        <i class="fas fa-microphone hover:text-blue-500 cursor-pointer"></i>
                    </div>
                </div>
                <button type="submit" 
                    class="w-14 h-14 md:w-16 md:h-16 bg-blue-600 rounded-2xl flex items-center justify-center shadow-xl shadow-blue-600/20 hover:bg-blue-500 hover:-translate-y-0.5 active:translate-y-0 transition-all">
                    <i class="fas fa-paper-plane text-lg"></i>
                </button>
            </form>
            <p id="typing-indicator" class="text-[10px] text-blue-500 mono italic mt-3 h-2 px-10"></p>
        </div>

        <div id="call-ui" class="hidden fixed inset-0 z-[100] bg-blue-700 flex flex-col items-center justify-center animate-pulse">
            <div class="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center mb-6 animate-bounce">
                <i class="fas fa-phone-alt text-4xl"></i>
            </div>
            <h2 id="caller-name" class="text-3xl font-black mb-1 text-white">UNKNOWN</h2>
            <p class="text-blue-200 text-xs tracking-[0.3em] font-bold uppercase mb-12">Incoming Encrypted Call</p>
            <div class="flex gap-8">
                <button onclick="handleCall(false)" class="w-16 h-16 bg-red-500 rounded-full flex items-center justify-center text-xl shadow-2xl hover:scale-110 transition-transform"><i class="fas fa-times"></i></button>
                <button onclick="handleCall(true)" class="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center text-xl shadow-2xl hover:scale-110 transition-transform"><i class="fas fa-check"></i></button>
            </div>
        </div>
    </main>

    <script>
        // --- SYSTEM CONFIG ---
        const PARAMS = new URLSearchParams(window.location.search);
        const ROOM_ID = PARAMS.get('room');
        const TARGET_NAME = PARAMS.get('target');
        const IS_GUEST = !!ROOM_ID;
        
        const STATE = {
            user: IS_GUEST ? TARGET_NAME : "Professor",
            room: ROOM_ID || null,
            lastCount: 0,
            online: true,
            isBooted: false
        };

        const api = async (method, params = '', body = null) => {
            const start = Date.now();
            try {
                const options = { method, headers: { 'Content-Type': 'application/json' } };
                if (body) options.body = JSON.stringify(body);
                const res = await fetch(`/api/messages?${params}`, options);
                const data = await res.json();
                
                // Update Ping
                const latency = Date.now() - start;
                document.getElementById('ping-timer').innerText = `${latency}ms`;
                return data;
            } catch (e) {
                console.error("Link Dropped:", e);
                return null;
            }
        };

        // --- BOOT SEQUENCE ---
        async function runBoot() {
            const logs = [
                "> INITIALIZING P.OS KERNEL 2.0.4...",
                "> CHECKING SATELLITE HANDSHAKE...",
                "> ALLOCATING MEMORY BLOCKS...",
                "> ESTABLISHING ENCRYPTED TUNNEL...",
                "> SYSTEM READY."
            ];
            const logEl = document.getElementById('boot-logs');
            const prog = document.getElementById('boot-progress');
            
            for(let i=0; i < logs.length; i++) {
                const p = document.createElement('p');
                p.innerText = logs[i];
                logEl.appendChild(p);
                prog.style.width = `${(i+1) * 20}%`;
                await new Promise(r => setTimeout(r, 400));
            }

            setTimeout(() => {
                document.getElementById('boot-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('boot-screen').remove(), 500);
                STATE.isBooted = true;
                init();
            }, 600);
        }

        // --- CORE FUNCTIONS ---
        function init() {
            if (IS_GUEST) {
                document.body.classList.add('guest-mode');
                document.getElementById('header-name').innerText = `GUEST: ${TARGET_NAME}`;
                document.getElementById('header-status').innerText = "LINK ENCRYPTED";
                document.getElementById('status-dot').className = "status-dot text-blue-500";
            } else {
                syncContacts();
                setInterval(syncContacts, 10000);
            }
            setInterval(syncChat, 3000);
        }

        async function addGlobalContact() {
            const name = document.getElementById('target-name').value.trim();
            if (!name) return;

            const roomCode = `X_NODE_${Math.floor(Math.random()*99999)}`;
            const link = `${window.location.origin}${window.location.pathname}?room=${roomCode}&target=${encodeURIComponent(name)}`;
            
            await api('POST', 'room=MASTER_LIST', { 
                user: "SYSTEM", 
                text: `${name}|${roomCode}|${link}`,
                type: 'contact_creation'
            });

            document.getElementById('target-name').value = '';
            syncContacts();
        }

        async function syncContacts() {
            if (IS_GUEST) return;
            const data = await api('GET', 'room=MASTER_LIST');
            if (!Array.isArray(data)) return;

            document.getElementById('contact-count').innerText = data.length;
            document.getElementById('contact-list').innerHTML = data.map(m => {
                const [name, room, link] = m.text.split('|');
                const isActive = STATE.room === room;
                return `
                    <div class="group p-4 rounded-2xl transition-all border border-transparent ${isActive ? 'bg-blue-600/10 border-blue-500/30' : 'hover:bg-white/5'}">
                        <div class="flex items-center justify-between">
                            <div class="cursor-pointer" onclick="setRoom('${room}', '${name}')">
                                <p class="text-sm font-bold ${isActive ? 'text-blue-400' : ''}">${name}</p>
                                <p class="text-[8px] mono text-slate-500 mt-1">${room}</p>
                            </div>
                            <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="navigator.clipboard.writeText('${link}')" class="text-slate-400 hover:text-white"><i class="fas fa-link text-[10px]"></i></button>
                                <button onclick="deleteContact('${room}')" class="text-slate-600 hover:text-red-500"><i class="fas fa-times text-[10px]"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function setRoom(room, name) {
            STATE.room = room;
            STATE.lastCount = 0;
            document.getElementById('header-name').innerText = name;
            document.getElementById('header-status').innerText = "CONNECTED";
            document.getElementById('status-dot').className = "status-dot text-green-500";
            document.getElementById('chat-window').innerHTML = '';
            syncChat();
        }

        async function syncChat() {
            if (!STATE.room) return;
            const msgs = await api('GET', `room=${STATE.room}`);
            if (!Array.isArray(msgs)) return;

            // Handle Incoming Call
            const last = msgs[msgs.length - 1];
            if (last && last.type === 'call' && last.user !== STATE.user && !STATE.activeCall) {
                triggerCallUI(last.user);
            }

            if (msgs.length === STATE.lastCount) return;

            const win = document.getElementById('chat-window');
            win.innerHTML = msgs.map((m, i) => {
                const isMine = m.user === STATE.user;
                return `
                    <div class="flex flex-col ${isMine ? 'items-end' : 'items-start'} animate-in fade-in slide-in-from-bottom-2 duration-300">
                        <div class="chat-bubble ${isMine ? 'mine' : 'theirs'}">
                            ${m.type === 'call' ? `<i class="fas fa-phone mr-2 opacity-50"></i>` : ''}
                            ${m.text}
                        </div>
                        <div class="flex gap-3 text-[9px] mt-1.5 px-2 font-bold tracking-tighter">
                            <span class="${isMine ? 'text-blue-400' : 'text-slate-500'} uppercase">${m.user}</span>
                            <span class="text-slate-600 mono">${m.time}</span>
                            ${!IS_GUEST ? `<button onclick="deleteMsg(${i})" class="text-slate-700 hover:text-red-500">DELETE</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            win.scrollTop = win.scrollHeight;
            STATE.lastCount = msgs.length;
        }

        // --- CALL SYSTEM ---
        function triggerCallUI(caller) {
            STATE.activeCall = true;
            document.getElementById('caller-name').innerText = caller;
            document.getElementById('call-ui').classList.remove('hidden');
            const ring = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-phone-ringing-bell-590.mp3');
            ring.play();
        }

        async function triggerCall() {
            if (!STATE.room) return;
            await api('POST', `room=${STATE.room}`, { 
                user: STATE.user, 
                text: "--- SECURE VOICE CHANNEL OPENED ---", 
                type: 'call' 
            });
        }

        function handleCall(accept) {
            document.getElementById('call-ui').classList.add('hidden');
            STATE.activeCall = false;
            if(accept) {
                alert("Voice Bridge Established. (Hardware simulation only)");
            }
        }

        // --- UTILS ---
        document.getElementById('send-form').onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            if (!input.value || !STATE.room) return;
            const text = input.value;
            input.value = '';
            
            await api('POST', `room=${STATE.room}`, { user: STATE.user, text });
            syncChat();
        };

        async function deleteContact(room) {
            if(!confirm("Purge Node from Master List?")) return;
            await api('DELETE', `room=MASTER_LIST&deleteRoom=${room}`);
            syncContacts();
        }

        async function deleteMsg(idx) {
            await api('DELETE', `room=${STATE.room}&index=${idx}`);
            syncChat();
        }

        function copyLink() {
            const url = `${window.location.origin}${window.location.pathname}?room=${STATE.room}&target=${document.getElementById('header-name').innerText}`;
            navigator.clipboard.writeText(url);
            alert("Secure Link Copied.");
        }

        window.onload = runBoot;
    </script>
</body>
</html>
