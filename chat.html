<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P.OS | Cloud Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <style>
        :root { --bg: #020617; --glass: rgba(15, 23, 42, 0.85); --accent: #2563eb; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: white; overflow: hidden; height: 100vh; }
        .glass { background: var(--glass); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.05); }
        
        /* SIDEBAR MOBILE LOGIC */
        .sidebar { 
            width: 320px; 
            border-right: 1px solid rgba(255,255,255,0.05); 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100%;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.6);
                backdrop-filter: blur(4px);
                z-index: 40;
            }
            .sidebar-overlay.active { display: block; }
        }

        body.guest-mode .sidebar, body.guest-mode #menu-toggle { display: none !important; }
        
        .chat-bubble { max-width: 85%; padding: 12px 16px; border-radius: 20px; font-size: 0.9rem; margin-bottom: 4px; position: relative; }
        .mine { background: var(--accent); align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(37,99,235,0.3); }
        .theirs { background: #1e293b; align-self: flex-start; border-bottom-left-radius: 4px; }
        
        #chat-window::-webkit-scrollbar { width: 4px; }
        #chat-window::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="flex">

    <div id="overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <aside id="sidebar" class="sidebar bg-slate-950 flex flex-col p-6">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-black text-blue-500 tracking-tighter italic">P.OS CONTROL</h2>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-500"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="mb-8 space-y-3">
            <input type="text" id="target-name" placeholder="Contact Name" 
                class="w-full bg-slate-900 border border-white/5 p-4 rounded-2xl outline-none text-sm focus:ring-1 ring-blue-500 text-white">
            <button onclick="addGlobalContact()" class="w-full bg-blue-600 p-4 rounded-2xl font-bold text-xs hover:bg-blue-500 transition text-white">
                <i class="fas fa-user-plus mr-2"></i> REGISTER CONTACT
            </button>
        </div>

        <div id="contact-list" class="flex-1 overflow-y-auto space-y-3">
            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Active Channels</p>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
        <header class="h-20 glass flex items-center justify-between px-4 md:px-8 border-b border-white/5 z-10">
            <div class="flex items-center gap-3">
                <button id="menu-toggle" onclick="toggleSidebar()" class="md:hidden w-10 h-10 flex items-center justify-center bg-slate-900 rounded-xl border border-white/5">
                    <i class="fas fa-bars text-blue-500"></i>
                </button>
                <div id="led" class="w-3 h-3 bg-slate-700 rounded-full"></div>
                <div>
                    <h1 id="header-name" class="font-bold text-sm md:text-lg text-blue-400 leading-none">Awaiting Command</h1>
                    <p id="header-status" class="text-[8px] md:text-[9px] text-slate-500 font-black uppercase mt-1">Satellite Link Offline</p>
                </div>
            </div>
            <div class="flex gap-2 md:gap-4">
                <button onclick="requestNotificationAccess()" class="w-8 h-8 md:w-auto flex items-center justify-center text-slate-400 hover:text-white">
                    <i class="fas fa-bell"></i>
                </button>
                <button onclick="copyCurrentLink()" class="text-[10px] font-bold text-blue-500 bg-blue-500/10 px-3 py-2 rounded-lg hover:bg-blue-500/20">SHARE</button>
            </div>
        </header>

        <div id="chat-window" class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col space-y-4">
            <div class="text-center opacity-20 mt-20">
                <i class="fas fa-shield-halved text-6xl mb-4"></i>
                <p class="text-xs uppercase tracking-widest">End-to-End Encrypted Node</p>
            </div>
        </div>

        <form id="send-form" class="p-4 md:p-6 bg-slate-950/80 flex gap-3 md:gap-4 border-t border-white/5">
            <input type="text" id="msg" autoComplete="off" placeholder="Type message..." class="flex-1 bg-slate-900 rounded-2xl px-5 py-3 md:py-4 outline-none border border-white/5 focus:ring-1 ring-blue-500 text-white text-sm">
            <button type="submit" class="w-12 h-12 md:w-14 md:h-14 bg-blue-600 rounded-2xl shadow-xl flex items-center justify-center text-white hover:bg-blue-500 transition">
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>
    </main>

    <script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
    }

    const PARAMS = new URLSearchParams(window.location.search);
    const ROOM = PARAMS.get('room');
    const TARGET = PARAMS.get('target');
    const IS_GUEST = !!ROOM;

    const STATE = {
        user: IS_GUEST ? TARGET : "Professor",
        room: ROOM || null,
        lastMsgCount: 0
    };

    // FORCE chat.html links
    function buildChatLink(room, name) {
        return `${window.location.origin}/chat.html?room=${room}&target=${encodeURIComponent(name)}`;
    }

    if (IS_GUEST) {
        document.body.classList.add('guest-mode');
        document.getElementById('header-name').innerText = `Welcome, ${TARGET}`;
        document.getElementById('header-status').innerText = "SECURE CHANNEL ACTIVE";
        document.getElementById('led').className = "w-3 h-3 bg-blue-500 animate-pulse rounded-full shadow-[0_0_10px_#2563eb]";
        startSync();
    }

    async function addGlobalContact() {
        const name = document.getElementById('target-name').value.trim();
        if(!name) return;

        const newRoom = `Exec_${name}_${Math.floor(Math.random()*9999)}`;
        const link = buildChatLink(newRoom, name);

        await fetch(`/api/messages?room=MASTER_LIST`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user: "SYSTEM", text: `${name}|${newRoom}|${link}` })
        });

        document.getElementById('target-name').value = '';
        syncContacts();
    }

    async function deleteContact(room) {
        if(!confirm("Delete this contact permanently?")) return;

        await fetch(`/api/messages?room=${room}`, { method: 'DELETE' });
        await fetch(`/api/messages?room=MASTER_LIST&deleteRoom=${room}`, { method: 'DELETE' });

        STATE.room = null;
        document.getElementById('chat-window').innerHTML = '';
        syncContacts();
    }

    async function clearMessages() {
        if(!STATE.room) return;
        if(!confirm("Clear all messages in this channel?")) return;

        await fetch(`/api/messages?room=${STATE.room}`, { method: 'DELETE' });
        document.getElementById('chat-window').innerHTML = '';
        STATE.lastMsgCount = 0;
    }

    async function syncContacts() {
        if (IS_GUEST) return;
        const res = await fetch(`/api/messages?room=MASTER_LIST`);
        const data = await res.json();

        document.getElementById('contact-list').innerHTML = data.map(m => {
            const parts = m.text.split('|');
            if(parts.length < 3) return '';
            const [name, room, link] = parts;

            return `
                <div class="p-4 glass rounded-2xl mb-2">
                    <div onclick="setRoom('${room}', '${name}')" class="cursor-pointer">
                        <span class="font-bold text-sm">${name}</span>
                    </div>
                    <div class="flex gap-3 mt-2 text-[9px] uppercase">
                        <button onclick="navigator.clipboard.writeText('${link}')" class="text-blue-500">Copy</button>
                        <button onclick="deleteContact('${room}')" class="text-red-500">Delete</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function setRoom(id, name) {
        STATE.room = id;
        document.getElementById('header-name').innerText = name;
        document.getElementById('header-status').innerText = "CONNECTED";
        syncChat();
    }

    async function syncChat() {
        if (!STATE.room) return;

        const res = await fetch(`/api/messages?room=${STATE.room}`);
        if(res.status === 404){
            alert("This channel no longer exists.");
            window.location.href = "/chat.html";
            return;
        }

        const msgs = await res.json();

        const win = document.getElementById('chat-window');
        win.innerHTML = msgs.map((m,i) => `
            <div class="flex flex-col ${m.user === STATE.user ? 'items-end' : 'items-start'} mb-2">
                <div class="chat-bubble ${m.user === STATE.user ? 'mine' : 'theirs'}">
                    ${m.text}
                </div>
                <div class="flex gap-2 text-[8px] px-2">
                    <span class="text-slate-500">${m.user}</span>
                    ${!IS_GUEST ? `<button onclick="deleteMessage(${i})" class="text-red-500">x</button>` : ''}
                </div>
            </div>
        `).join('');

        win.scrollTop = win.scrollHeight;
        STATE.lastMsgCount = msgs.length;
    }

    async function deleteMessage(index) {
        await fetch(`/api/messages?room=${STATE.room}&index=${index}`, {
            method: 'DELETE'
        });
        syncChat();
    }

    async function callUser() {
        if(!STATE.room) return;

        await fetch(`/api/messages?room=${STATE.room}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user: STATE.user, text: "📞 Incoming Call..." })
        });

        new Notification("Incoming Call", { body: "User is calling you" });
    }

    document.getElementById('send-form').onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById('msg');
        if(!input.value || !STATE.room) return;

        await fetch(`/api/messages?room=${STATE.room}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user: STATE.user, text: input.value })
        });

        input.value = '';
        syncChat();
    };

    function startSync() {
        setInterval(syncChat, 3000);
        if(!IS_GUEST) setInterval(syncContacts, 10000);
    }

    if(!IS_GUEST) syncContacts();
    startSync();
</script>
</body>
</html>
